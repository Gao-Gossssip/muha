name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    # The native supervisor's frozen ABI guard is qualified with this toolchain.
    # Newer glibc headers may emit symbols above the unchanged 2.28 floor.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "22.20.0"
          - "lts/*"
          - "current"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm run check:repository -- . HEAD
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  windows-contract:
    runs-on: windows-2022
    # Isolated installation suites run serially on Windows to avoid competing
    # extractions. Individual command/test bounds still apply within this job.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "22.20.0"
          - "lts/*"
          - "current"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm run check:repository -- . HEAD
      - run: npm ci
      - run: npm run build --silent
      - run: node --test --test-concurrency=2 test/contracts/windows-paths.test.mjs test/contracts/windows-host.test.mjs test/contracts/opencode-windows-cleanup.test.mjs test/contracts/opencode-v2-failures.test.mjs test/contracts/opencode-v2-service.test.mjs test/contracts/opencode-v2-fixture-evidence.test.mjs test/contracts/agy-events.test.mjs test/contracts/agy-resume.test.mjs test/contracts/kimi-rich-turn.test.mjs test/contracts/kimi-windows-evidence.test.mjs
      - run: npm run check
